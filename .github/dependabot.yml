# Dependabot configuration for automated dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Monitor npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - "jra3"
    labels:
      - "dependencies"
    # Group minor/patch bumps so each week brings two PRs, not one per package.
    # Majors still arrive one per PR so they can be reviewed on their own.
    groups:
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
    # Commit message prefix
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
    # Only packages listed in package.json. Indirect packages move when their
    # parent does; one PR per transitive bump was mostly noise.
    assignees:
      - "jra3"

  # Monitor GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
