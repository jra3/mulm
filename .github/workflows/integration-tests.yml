name: Integration Tests

# Tests that call somebody else's server: Wikipedia and GBIF. They belong to
# a cadence, not to every push — an upstream outage is not a reason to redden
# a pull request — so this workflow runs nightly and on demand, and never on
# a PR.
#
# The suites themselves are gated on RUN_EXTERNAL_TESTS (see
# src/__tests__/helpers/externalTests.ts), which this workflow sets. Without
# it they skip, which is what keeps `npm test` hermetic everywhere else.

on:
  # Run nightly at 2 AM UTC
  schedule:
    - cron: '0 2 * * *'

  # Allow manual trigger
  workflow_dispatch:

jobs:
  integration-tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup config file
        run: cp src/config.sample.json src/config.json

      - name: Run external integration tests
        run: npm run test:external
        env:
          NODE_ENV: test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results
          path: |
            test-results/
          retention-days: 7
